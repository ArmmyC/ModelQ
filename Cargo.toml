[package]
name = "modelq"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
clap = { version = "=4.6.6", default-features = false, features = [
    "std",
    "help",
    "usage",
    "error-context",
    "suggestions",
] }
half = "=2.4.1"
memmap2 = "=0.9.11"
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
