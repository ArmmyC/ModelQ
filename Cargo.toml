[package]
name = "modelq"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[workspace]
members = [
    "crates/modelq-backend",
    "crates/modelq-core",
    "crates/modelq-quant",
    "crates/modelq-io",
]
resolver = "2"

[dependencies]
clap = { version = "=4.6.6", default-features = false, features = [
    "std",
    "help",
    "usage",
    "error-context",
    "suggestions",
] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
sha1 = "=0.11.0"
sha2 = "=0.11.0"
ureq = { version = "=3.4.2", default-features = false, features = ["native-tls", "gzip"] }
modelq-backend = { path = "crates/modelq-backend" }
modelq-core = { path = "crates/modelq-core" }
modelq-io = { path = "crates/modelq-io" }
modelq-quant = { path = "crates/modelq-quant" }

[dev-dependencies]

[[bench]]
name = "cpu_parallel"
harness = false

[[bench]]
name = "nvfp4_parallel"
harness = false

[[bench]]
name = "int8_streaming"
harness = false

[[bench]]
name = "nvfp4_scale_search"
harness = false
